```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NDtube — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100%;
      height:100vh;
      overflow:hidden;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#000;
      font-family:'Inter',sans-serif;
      color:#fff;

      position:relative;
    }

    body::before{
      content:"";
      position:absolute;
      inset:0;

      background:
      radial-gradient(circle at top left, rgba(255,122,0,.15), transparent 30%),
      radial-gradient(circle at bottom right, rgba(255,159,67,.12), transparent 35%),
      radial-gradient(circle at center, rgba(255,122,0,.05), transparent 50%);

      z-index:0;
    }

    .glow{
      position:absolute;
      width:500px;
      height:500px;
      border-radius:50%;

      background:radial-gradient(circle, rgba(255,122,0,.22), transparent 70%);

      filter:blur(80px);

      animation:float 8s ease-in-out infinite alternate;
    }

    .glow.one{
      top:-180px;
      left:-120px;
    }

    .glow.two{
      bottom:-220px;
      right:-120px;
      animation-delay:2s;
    }

    @keyframes float{
      from{
        transform:translateY(0px) translateX(0px);
      }
      to{
        transform:translateY(40px) translateX(25px);
      }
    }

    .card{
      position:relative;
      z-index:2;

      width:min(700px,90%);
      padding:70px 40px;

      border-radius:32px;

      background:rgba(255,255,255,.03);

      border:1px solid rgba(255,255,255,.08);

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);

      text-align:center;

      box-shadow:
      0 20px 80px rgba(0,0,0,.6),
      0 0 60px rgba(255,122,0,.08);
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;

      padding:10px 18px;

      border-radius:999px;

      background:rgba(255,255,255,.04);

      border:1px solid rgba(255,255,255,.08);

      margin-bottom:28px;

      color:#d7d7d7;

      font-size:.9rem;
      font-weight:500;
    }

    .badge::before{
      content:"";
      width:8px;
      height:8px;
      border-radius:50%;

      background:#ff7a00;

      box-shadow:0 0 15px #ff7a00;
    }

    h1{
      font-size:clamp(2.5rem,7vw,5rem);
      line-height:1;
      font-weight:800;

      margin-bottom:20px;

      letter-spacing:-2px;
    }

    h1 span{
      background:linear-gradient(to bottom,#ff9f43,#ff7a00);

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;

      text-shadow:0 0 30px rgba(255,122,0,.25);
    }

    p{
      color:#b5b5b5;
      font-size:1.05rem;
      line-height:1.8;
      max-width:500px;
      margin:auto;
    }

  </style>
</head>

<body>

  <div class="glow one"></div>
  <div class="glow two"></div>

  <div class="card">

    <div class="badge">
      NDtube
    </div>

    <h1>
      Coming <span>Soon</span>
    </h1>

    <p>
      Application under construction.
      <br>
      We are crafting a premium experience for the future of background audio playback.
    </p>

  </div>

</body>
</html>
```
